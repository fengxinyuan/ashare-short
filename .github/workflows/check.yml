name: Checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install development dependencies
        run: python -m pip install -e ".[dev]"
      - name: Check code, documentation and offline tests
        run: python scripts/check.py
      - name: Build source and wheel distributions
        run: python -m build
      - name: Install the wheel
        run: python -m pip install --force-reinstall --no-deps dist/*.whl
      - name: Check installed CLI and MCP outside the checkout
        working-directory: ${{ runner.temp }}
        run: |
          ashare-ds --help
          python - <<'PY'
          import json
          import subprocess
          from importlib.metadata import version

          messages = [
              {
                  "jsonrpc": "2.0", "id": 1, "method": "initialize",
                  "params": {
                      "protocolVersion": "2024-11-05", "capabilities": {},
                      "clientInfo": {"name": "package-check", "version": "1"},
                  },
              },
              {"jsonrpc": "2.0", "method": "notifications/initialized"},
              {"jsonrpc": "2.0", "id": 2, "method": "tools/list"},
          ]
          result = subprocess.run(
              ["ashare-ds-mcp"],
              input="".join(json.dumps(message) + "\n" for message in messages),
              capture_output=True, text=True, check=True, timeout=15,
          )
          replies = [json.loads(line) for line in result.stdout.splitlines()]
          assert [reply["id"] for reply in replies] == [1, 2]
          assert replies[0]["result"]["serverInfo"]["version"] == version(
              "a-share-ultra-short-ai-system"
          )
          assert replies[1]["result"]["tools"]
          PY
