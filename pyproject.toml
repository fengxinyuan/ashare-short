[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "a-share-ultra-short-ai-system"
# 包元数据与 MCP 共用 __version__。
dynamic = ["version"]
description = "A-share ultra-short AI analysis and decision support system"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.5,<3.0",
  "tzdata>=2024.1; sys_platform == 'win32'",
]

[project.optional-dependencies]
akshare = [
  "akshare>=1.18,<2.0",
]
tickflow = [
  "tickflow",
]
dev = [
  "build>=1.2,<2.0",
  "pytest>=9.0,<10.0",
  "ruff>=0.16.1,<0.17",
]

[project.scripts]
ashare-ds = "ashare_decision_support.cli:main"
ashare-ds-mcp = "ashare_decision_support.mcp_server:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.dynamic]
version = {attr = "ashare_decision_support.__version__"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
src = ["src"]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
# 规则显式列出，升级 ruff 时不依赖默认规则集。
select = [
  "F",                  # 未定义名、未使用导入与变量
  "E4", "E7", "E9",     # 不与格式化冲突的语法和风格规则
  "I", "UP", "B", "C4",
  "C90",                # 函数复杂度
  "SIM", "PERF", "PIE", "FLY", "FURB", "ISC", "RUF", "S", "PL",
  # 禁止依赖宿主机时区取当前时间；统一经 schedule/timezone.py。
  # 构造、解析无时区的北京墙上时间是合法的，所以不启用整个 DTZ 族。
  "DTZ002", "DTZ003", "DTZ004", "DTZ005", "DTZ006", "DTZ011", "DTZ012",
]

ignore = [
  "RUF001", "RUF002", "RUF003",  # 中文正文与注释需要全角标点
  "PLC0415",                     # 函数内导入用于可选依赖和避免循环导入
  "PLR2004",                     # 领域阈值不强制逐一命名
  "PLR0913", "PLR0917",          # job 入口显式注入多个数据源与配置
  "PERF401",                     # 渲染代码逐行 append 比生成式更易读
  "PLW2901",                     # 允许 line = line.strip() 等就地归一化
  "PLW0108",                     # 数据源 thunk 必须延迟解析属性
  "S105", "S106",                # 环境变量名与测试假密钥会误报
  "S101",                        # pytest 使用 assert
  "S310",                        # urllib 是行情和舆情适配器的既有传输层
  "S608",                        # SQL 动态表名来自内部字面量集合
]

[tool.ruff.lint.isort]
known-first-party = ["ashare_decision_support"]

[tool.ruff.lint.mccabe]
# 新逻辑超限时按职责拆分，不扩大豁免。
max-complexity = 13

[tool.ruff.lint.pylint]
# 分档判定和外部数据类型分发采用提前返回，避免深层嵌套。
max-returns = 10

[tool.ruff.lint.per-file-ignores]
# 测试桩用类属性记录调用；每个测试重新构造。
"tests/*" = ["RUF012"]
# 审计脚本是按步骤探测数据源、输出结果的线性过程。
"scripts/*" = ["PLR0915", "C901"]
# 单个监控循环共享多份状态；拆分后反而需要额外状态传递。
"src/ashare_decision_support/monitor/loop.py" = ["PLR0912", "PLR0915", "C901"]
# 外部行情字段组合较多，保留显式分支。
"src/ashare_decision_support/adapters/tickflow_intraday.py" = ["PLR0912"]
