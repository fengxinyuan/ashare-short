[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "a-share-ultra-short-ai-system"
version = "0.2.0"
description = "A-share ultra-short AI analysis and decision support system"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.5,<3.0",
]

[project.optional-dependencies]
akshare = [
  "akshare>=1.18,<2.0",
]
tickflow = [
  "tickflow",
]
# Measured 2026-08-01: the free path to 五档盘口 and whole-market snapshots.
# Optional because nothing in src/ imports them yet — scripts/source_audit.py
# skips whichever is missing. See docs/DATA_SOURCES.md.
quotes = [
  "easyquotation>=0.7",
]
backtest = [
  "baostock>=0.9",
]
dev = [
  "pytest>=9.0",
]

[project.scripts]
ashare-ds = "ashare_decision_support.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
